name: race-day
title: "Race Day"
adopt-info: race-day
base: core24
summary: A 3D platformer in the sky. Explore every island, then race through it.
description: |
  Race Day is a 3D platformer across a chain of floating islands.
  Run, jump, long jump, dive, ground pound and kick off walls to find stars
  and hidden gems, then race the courses against the clock and your own
  ghost.

  - Adventure: explore each island at your own pace, help the islanders and
    open the Skyway's rainbow bridges with the stars you find
  - Speedrun: every course Adventure finds is a time trial with medals, a
    clock to the hundredth and your best run's ghost beside you
  - A calm camera that sits behind and above and turns gently, with comfort
    settings for turn speed, field of view and a follow-behind mode
  - Made for controllers and handhelds, fully playable with a mouse and
    keyboard
icon: icon.png
grade: stable
confinement: strict
compression: lzo
license: MIT AND CC0-1.0 AND Apache-2.0
website: https://github.com/LinuxGroove/race-day
source-code: https://github.com/LinuxGroove/race-day
issues: https://github.com/LinuxGroove/race-day/issues

platforms:
  amd64:
  arm64:

apps:
  race-day:
    command: bin/race-day
    extensions: [gnome]
    plugs:
      - audio-playback
      - joystick
      - network

parts:
  race-day:
    plugin: nil
    source: .
    build-packages:
      - curl
      - unzip
      - ca-certificates
      - libfontconfig1
    stage-packages:
      - libasound2t64
      - libpulse0
      - libdecor-0-0
      - libfontconfig1
      - libudev1
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libxkbcommon0
      - libx11-6
      - libxcursor1
      - libxext6
      - libxi6
      - libxinerama1
      - libxrandr2
      - libxrender1
      - libdbus-1-3
    override-pull: |
      craftctl default
      craftctl set version="$(sed -n 's/^config\/version="\(.*\)"/\1/p' project.godot)"
    override-build: |
      # Godot version used to export; keep in step with the project.
      GODOT_VERSION=4.7.2
      case "$CRAFT_ARCH_BUILD_FOR" in
        amd64) ARCH=x86_64; PRESET=Linux ;;
        arm64) ARCH=arm64; PRESET="Linux ARM64" ;;
        *) echo "Unsupported architecture: $CRAFT_ARCH_BUILD_FOR"; exit 1 ;;
      esac
      BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
      curl -sSfL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.${ARCH}.zip"
      curl -sSfL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
      unzip -o -q godot.zip
      GODOT="$PWD/Godot_v${GODOT_VERSION}-stable_linux.${ARCH}"
      export HOME="$PWD/.home"
      TEMPLATES="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
      mkdir -p "$TEMPLATES"
      unzip -o -q -j templates.tpz "templates/linux_release.${ARCH}" templates/version.txt -d "$TEMPLATES"
      "$GODOT" --headless --path . --import
      mkdir -p "$CRAFT_PART_INSTALL/game" "$CRAFT_PART_INSTALL/bin"
      "$GODOT" --headless --path . --export-release "$PRESET" "$CRAFT_PART_INSTALL/game/race-day"
      test -f "$CRAFT_PART_INSTALL/game/race-day.pck"
      install -m 755 snap/local/race-day "$CRAFT_PART_INSTALL/bin/"
      cp LICENSE CREDITS.md "$CRAFT_PART_INSTALL/game/"
